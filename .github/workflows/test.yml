name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package build tooling
        run: python -m pip install --upgrade pip build

      - name: Build reproducible distributions
        env:
          SOURCE_DATE_EPOCH: '315532800'
        run: python -m build --sdist --wheel --outdir dist

      - name: Check distribution contents
        run: python tools/check_package_contents.py --report reports/package-content-report.txt dist/*.whl dist/*.tar.gz

      - name: Install wheel in an isolated environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/quantum-consumer"
          set -o pipefail
          "$RUNNER_TEMP/quantum-consumer/bin/python" -m pip install --no-cache-dir --find-links dist dist/*.whl 2>&1 | tee reports/install-validation.txt
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/quantum-consumer/bin/python" "$GITHUB_WORKSPACE/tools/package_smoke.py" --report "$GITHUB_WORKSPACE/reports/api-smoke.txt"

      - name: Publish package validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distribution-artifacts
          path: dist/*.whl

      - name: Publish source distribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz

      - name: Publish install validation marker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-install-validation
          path: reports/install-validation.txt

      - name: Publish package content report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-content-report
          path: reports/package-content-report.txt

      - name: Publish API smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-smoke-report
          path: reports/api-smoke.txt

  test:
    runs-on: ubuntu-latest
    # CI runtime budget — bump as test suite grows (FR-20260425)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Install pinned Ruff for advisory checks
        run: |
          mkdir -p tmp/ruff-advisory-local
          if python -m pip install ruff==0.17.2 >tmp/ruff-advisory-local/ruff-install.log 2>&1; then
            echo "Pinned Ruff installed."
          else
            echo "Ruff installation failed; local advisory diagnostics will record the tool error."
          fi

      - name: Run advisory Ruff checks
        if: always()
        run: |
          mkdir -p tmp/ruff-advisory-local
          python tools/run_ruff_advisory.py --config pyproject.toml --output-dir tmp/ruff-advisory-local 2>tmp/ruff-advisory-local/runner.stderr.txt || echo "Advisory report generation failed; CI remains advisory." >&2

      - name: Install pinned mypy for advisory checks
        run: |
          mkdir -p tmp/mypy-advisory-local
          if python -m pip install mypy==1.18.2 >tmp/mypy-advisory-local/mypy-install.log 2>&1; then
            echo "Pinned mypy installed."
          else
            echo "mypy installation failed; advisory diagnostics will record the tool error."
          fi

      - name: Run advisory mypy checks
        if: always()
        run: |
          mkdir -p tmp/mypy-advisory-local
          python tools/run_mypy_advisory.py --config pyproject.toml --output-dir tmp/mypy-advisory-local 2>tmp/mypy-advisory-local/runner.stderr.txt || echo "Advisory report generation failed; CI remains advisory." >&2

      - name: Report bounded long-running tests
        shell: bash
        run: |
          expected='tests/test_vqe.py::test_lih_chemical_accuracy'
          expected_count=1
          selected="$(pytest --collect-only -qq -m ci_long_running | grep -E '^tests/.+::' || true)"
          count="$(printf '%s\n' "$selected" | sed '/^$/d' | wc -l | tr -d ' ')"
          echo "CI bounded exclusion count: $count (expected: $expected_count)"
          echo "CI bounded exclusion reason: LiH VQE is a local Aer/SLSQP optimization that takes approximately 15 min on the CI runner; it is intentionally bounded out of canonical CI while remaining runnable and marked slow."
          test "$count" -eq "$expected_count"
          test "$selected" = "$expected"

      - name: Configure bundled OpenMP runtime preload
        shell: bash
        run: |
          site_packages="$(python -c 'import sysconfig; print(sysconfig.get_paths()["platlib"])')"
          openmp_libs=()
          for library in \
            "$site_packages"/scikit_learn.libs/libgomp-*.so* \
            "$site_packages"/qiskit_aer.libs/libgomp-*.so*; do
            if [[ -f "$library" ]]; then
              openmp_libs+=("$library")
            fi
          done
          if ((${#openmp_libs[@]})); then
            preload="$(IFS=:; printf '%s' "${openmp_libs[*]}")"
            if [[ -n "${LD_PRELOAD:-}" ]]; then
              preload="${LD_PRELOAD}:$preload"
            fi
            printf 'LD_PRELOAD=%s\n' "$preload" >> "$GITHUB_ENV"
          fi

      - name: Run pytest
        env:
          PLAYWRIGHT_ENABLED: "0"  # Set to "1" locally to run Playwright tests (FR-20260513-playwright-ui-gate)
        run: python tools/run_tests.py --parallel --junitxml tmp/pytest-junit.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: tmp/pytest-junit.xml

      - name: Upload advisory Ruff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-advisory-quantum-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/ruff-advisory-ci/${{ github.run_id }}-${{ github.run_attempt }}/summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload advisory mypy report
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-advisory-quantum-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/mypy-advisory-ci/${{ github.run_id }}-${{ github.run_attempt }}/summary.json
          if-no-files-found: warn
          retention-days: 30
