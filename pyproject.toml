[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-toolkit"
version = "0.1.0"
description = "Quantum-measurement-seeded random utilities"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Tyler James Drake" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["quantum_toolkit*", "utils*"]
