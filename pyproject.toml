[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-toolkit"
version = "0.1.0"
description = "Quantum-measurement-seeded random utilities"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Tyler James Drake" }]
dependencies = [
	"Flask>=3.0,<4",
	"boto3>=1.35,<2",
	"gunicorn>=23,<24",
	"qiskit-ibm-runtime>=0.35,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["quantum_toolkit*", "quantum_randomness_service*", "utils*"]

[tool.setuptools]
py-modules = ["quantum_rt"]
