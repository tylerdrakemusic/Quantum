[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Slow tests run by default; use `pytest -m "not slow"` for a fast local pass.
addopts = -v --tb=short -rs
markers =
    slow: marks tests as slow (deselect with '-m "not slow"' when needed)
    ci_long_running: marks a genuinely long-running test explicitly bounded out of canonical CI
    playwright: marks tests as requiring Playwright browser (skip in CI unless PLAYWRIGHT_ENABLED=1)
    ci_unavailable: marks tests whose justified external infrastructure is unavailable in canonical CI
