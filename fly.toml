app = "quantum-randomness"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  QUANTUM_CACHE_DIR = "/data/verified"
  QUANTUM_MANIFEST_URL = "https://fly.storage.tigris.dev/quantum-randomness-cache/verified/generation.json"
  QUANTUM_MANIFEST_SIGNING_KEY = ""

[[mounts]]
  source = "quantum_randomness_data"
  destination = "/data"

[[services]]
  internal_port = 8211
  protocol = "tcp"
  processes = ["machine"]
  [[services.ports]]
    handlers = ["http"]
    port = 80
  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
  processes = ["machine"]

[processes]
  machine = "python tools/run_randomness_machine.py"